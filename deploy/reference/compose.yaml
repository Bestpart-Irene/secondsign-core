#
# The reference deployment: a topology in which no-bypass is a property of the
# network rather than of the agent's good behaviour.
#
#   agent ──agentnet── gateway ──railnet── rail
#     ×────────────────────────────────────┘
#
# `agent` is joined to `agentnet` and nothing else. There is no firewall rule
# doing this and no policy to misconfigure: the container has no interface on
# the network the rail is on, so "the agent cannot reach the rail" is a fact
# about what exists rather than about what is permitted. That distinction is
# what `tests/deployment/` asserts by errno — ECONNREFUSED would mean a control
# is running and declining, and a running control can be turned off.
#
# Both networks are `internal: true`, so neither has a route off the host. That
# models the deployment precondition honestly: an agent that can reach the open
# internet can reach a payment API, and no packaging or process decision in this
# project prevents that. See docs/decisions/0003 and README.md.
#
# WHAT THIS DOES NOT DEMONSTRATE, stated here because a compose file reads as an
# endorsement: bind mounts are not a secret store, containers are not a security
# boundary against a host-privileged attacker, and a container escape defeats all
# of this. It demonstrates network isolation and custody separation. Nothing more.

name: secondsign-reference

services:
  # NOTE: run `python tls/generate.py` before `docker compose up`. The PKI is
  # generated on the host rather than by a service here, and that is a
  # correction rather than the original design.
  #
  # Generation was a Compose service until it turned out that
  # `docker compose up certs` exits 0 when the container stops — whatever code
  # it stopped with. The harness check on that exit code therefore could not
  # fail: generation produced nothing, the stack came up without certificates,
  # and the symptom appeared later as "the agent cannot read its own client
  # key", which reads like a mount bug. `tests/deployment/conftest.py` now runs
  # the script directly and checks that a certificate exists, because the
  # artefact is the evidence and the exit code was not.

  rail:
    build:
      context: .
      dockerfile: rail/Dockerfile
    networks: [railnet]
    environment:
      RAIL_PORT: "9000"
      RAIL_LEDGER: /var/log/rail/requests.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',9000),timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    build:
      context: ../..
      dockerfile: deploy/reference/gateway/Dockerfile
    # The only container on all three networks. That is the whole design: it is
    # the single point at which a request can cross from the agent's world into
    # the rail's — or from the approver's into either — which is what makes
    # "stop the gateway and execution becomes impossible" true rather than
    # aspirational.
    #
    # The static address is not decoration. The approver listener binds to the
    # gateway's approvernet interface *specifically*, so the second door simply
    # does not exist on the network the agent is joined to — bound to 0.0.0.0 it
    # would answer on agentnet too, and "the agent cannot reach the approval
    # channel" (B6) would be an mTLS property rather than a routing fact.
    networks:
      agentnet: {}
      railnet: {}
      approvernet:
        # Interpolated so a second stack (the mutation suites stand up two at
        # once) can move the whole subnet instead of colliding with this one.
        # An operator never sets these; the default is the deployment.
        ipv4_address: ${SECONDSIGN_APPROVERNET_GATEWAY:-172.28.99.10}
    depends_on:
      rail: {condition: service_healthy}
    volumes:
      # Read-only, and only this service's own directory. `tls/ca/` — which
      # holds the signing key — is mounted into nothing at all: an agent that
      # could read it could mint a certificate naming itself any principal.
      - ./tls/gateway:/etc/secondsign/tls:ro
      # The vacuity guard probes rail reachability *from this container* —
      # "the rail is unreachable from the agent" means nothing until something
      # is shown to reach it. Same read-only probe the agent gets.
      - ./adversary:/adversary:ro
    environment:
      # The rail credential lives here and nowhere else. `tests/deployment/`
      # asserts its presence here and its absence from the agent.
      SECONDSIGN_RAIL_API_KEY: "sk_reference_not_a_real_key"
      SECONDSIGN_RAIL_URL: "http://rail:9000"
      SECONDSIGN_BIND: "0.0.0.0:8787"
      SECONDSIGN_TLS_CERT: /etc/secondsign/tls/gateway-cert.pem
      SECONDSIGN_TLS_KEY: /etc/secondsign/tls/gateway-key.pem
      SECONDSIGN_CLIENT_CA: /etc/secondsign/tls/ca-cert.pem
      SECONDSIGN_CLIENT_ALLOWLIST: "spiffe://secondsign.example/agent/reference"
      # The approver channel (CORE-S023): its own bind address, its own trust
      # anchor, its own population. Configuring it is also what turns on the
      # review band — a deployment that can park an action for a human must
      # hold a door a human can answer through.
      SECONDSIGN_APPROVER_BIND: "${SECONDSIGN_APPROVERNET_GATEWAY:-172.28.99.10}:8788"
      SECONDSIGN_APPROVER_TLS_CERT: /etc/secondsign/tls/approver-cert.pem
      SECONDSIGN_APPROVER_TLS_KEY: /etc/secondsign/tls/approver-key.pem
      SECONDSIGN_APPROVER_CA: /etc/secondsign/tls/approver-ca-cert.pem
      SECONDSIGN_APPROVER_ALLOWLIST: "spiffe://secondsign.example/approver/reference"
    command: ["python", "-m", "secondsign.gateway.server"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8787),timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  approver:
    build:
      context: .
      dockerfile: approver/Dockerfile
    # One network, and it is not the agent's. The approver reaches the second
    # listener and nothing else; the agent has no interface here at all.
    networks: [approvernet]
    volumes:
      # Its own client credential, under the approver CA — the agent CA cannot
      # mint one of these, and the gateway refuses to start if the two anchors
      # are one certificate.
      - ./tls/approver:/etc/secondsign/tls:ro
      - ./approver:/approver:ro
      - ./adversary:/adversary:ro
    command: ["sleep", "infinity"]

  agent:
    build:
      # The repository root, because this container installs `secondsign-client`
      # from source. It gets the client and nothing else: no core, no rails, no
      # gateway — which the deployment suite verifies by executing the import.
      context: ../..
      dockerfile: deploy/reference/agent/Dockerfile
    # One network. This line is the security control.
    networks: [agentnet]
    volumes:
      - ./tls/agent:/etc/secondsign/tls:ro
      - ./adversary:/adversary:ro
    # Deliberately no SECONDSIGN_RAIL_API_KEY, and deliberately no mount of
    # ./tls/ca or ./tls/gateway. The agent holds its own client key — it must,
    # or it could not authenticate — and nothing else. "The agent container
    # holds no credential" would be false, and the suite does not claim it.
    command: ["sleep", "infinity"]

networks:
  # No route off the host on any of them. An agent with general egress has
  # bypassed this design regardless of what SecondSign does, and pretending
  # otherwise would make the demonstration weaker than it looks.
  agentnet:
    internal: true
  railnet:
    internal: true
  # The approver's network (CORE-S023). The fixed subnet exists so the gateway
  # can hold a known address on it — the approver listener binds to that
  # address alone, which is what keeps the second door off agentnet.
  approvernet:
    internal: true
    ipam:
      config:
        - subnet: "${SECONDSIGN_APPROVERNET_SUBNET:-172.28.99.0/24}"
