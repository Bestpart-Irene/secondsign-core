name: CI

# Every gate a slice can declare runs here. A contributor should never have to
# ask whether a change is acceptable: if CI is green and the slice manifest
# validates, the security boundary is intact by construction.
#
# The shape is five jobs and a gate:
#
#   preflight     one Python, the checks that answer the same on every version:
#                 lint, format, types, import boundaries, manifests, status,
#                 declared scope. Running these three times told us three times
#                 that a line was too long.
#   tests         the version matrix, because a *test* result genuinely differs
#                 between 3.11 and 3.13, and nothing else here does.
#   onchain       Solidity — conditional; see tools/ci_gates.py
#   independence  dependency boundary, sign-off, secret scan
#   package       build, distribution metadata, dependency licences
#   CI gate       the one required check on `main`
#
# `CI gate` fails unless every job above either succeeded or was skipped for a
# reason `tools/ci_gates.py` had already recorded. Two things follow. The matrix
# can gain a Python version, or a job can be split, without anyone editing
# branch protection — and a job that quietly stops running fails the build
# instead of vanishing into a grey tick, which is what a protection rule listing
# job names cannot notice: a required check that no longer exists is simply
# never reported.
#
# Every action is pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer its owner can move, so `@v4` names whatever that account publishes
# next — and these jobs decide whether a change to a payment authorization
# boundary is safe to merge. Foundry and gitleaks below were already pinned by
# version and checksum on exactly this reasoning; the actions were the
# inconsistency. The trailing comment records the intended version so Dependabot
# can still propose upgrades, as a reviewable diff rather than silently.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything whose answer does not depend on the Python version, once.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      # Which conditional jobs this change needs. The `if:` expressions below
      # carry no logic of their own — they read this, and `CI gate` checks it
      # against what actually ran.
      decisions: ${{ steps.gates.outputs.decisions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Both distributions: core, and the agent-side client that must not depend
      # on it (CORE-S019 / ADR 0003). Editable, so the suite imports what this
      # commit holds; `tests/client/` asserts the built wheel's metadata
      # separately, which is a different question.
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" && pip install -e client/

      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src client/src
      - name: Import and architecture boundaries
        run: lint-imports

      - name: Slice manifests
        run: python tools/validate_slice.py docs/slices/roadmap.yaml

      # Relative links only, and no fetching: a gate that depends on someone
      # else's uptime fails for reasons unrelated to this repository, and gets
      # switched off within a month.
      - name: Documentation links resolve
        run: python tools/check_doc_links.py

      # STATUS.md is derived from the roadmap and from Git, and committed only so
      # it renders on GitHub. Checking it here is what keeps it a derived artefact
      # instead of a second place the project's status has to be maintained — and
      # a stale status table is precisely the drift that costs a security project
      # its credibility.
      #
      # The fetch is not optional. The tool refuses to judge staleness from a
      # history in which it can attribute no slice at all — reporting everything
      # as unbuilt would be the fail-open form of this check. This step is also
      # where freshness against the real repository is asserted; the test suite
      # deliberately does not, so that it keeps passing on a shallow clone.
      #
      # Pull requests only, and that is not a loophole. What this check defends
      # against is someone maintaining STATUS.md by hand, which can only happen
      # on a branch. On a push to `main` it asks a question the commit under test
      # cannot answer: a slice is complete once trunk holds the merge of its
      # branch, so the merge that completes a slice is guaranteed to arrive with
      # a stale file, every time, through no one's fault. Failing there reports
      # the project succeeding, and a check that cries wolf on success is how a
      # red `main` stops meaning anything. `.github/workflows/derived.yml`
      # regenerates the file after the merge instead.
      - name: Roadmap status table is not stale
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=200 origin main:refs/remotes/origin/main
          python tools/render_roadmap.py --check

      # The manifest already promises which files a slice may touch. Checking
      # that promise mechanically is what stops "while I was in there" changes
      # arriving on a decision path inside a PR that says something else.
      - name: Declared slice scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          python tools/check_slice_scope.py

      - name: Which conditional jobs this change needs
        id: gates
        run: python tools/ci_gates.py decide

  # The version matrix, and only what a version can change the answer to.
  #
  # README states branch coverage is 100%. A claim about this repository that
  # only a convention keeps true is the kind of drift this project cannot
  # afford, so the gate is set where the claim is rather than below it. Coverage
  # is an execution measure, not evidence the assertions are right — it belongs
  # here as a ratchet, and nowhere as a security argument.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `client/` too, and not only because its own suite needs it: pytest
      # imports every test module at collection time, including `tests/client/`,
      # before any marker deselects anything. "Deselected" and "not imported"
      # look the same from a distance and are not.
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" && pip install -e client/

      # The client package is under the same ratchet as core: a refusal path in
      # the transport that no test reaches is a refusal nobody has proven happens.
      - name: Tests (unit, properties, contracts, conformance, architecture)
        run: pytest --cov=secondsign --cov=secondsign_client --cov-report=term-missing --cov-fail-under=100

  # The `deployment_topology` gate (CORE-S019).
  #
  # Every other suite tests the engine from inside a cooperating process. That is
  # right for testing a decision and wrong for testing a boundary: the agent worth
  # defending against is the one that stopped cooperating, and it does not import
  # the client. So this job stands up `deploy/reference/` — two networks joined
  # only by the gateway — and runs standard-library attack code *inside the agent
  # container*, alongside the sanctioned path proving the same container can move
  # money when it asks properly.
  #
  # Conditional, on the same terms as the Solidity job and for the same reason:
  # it builds three container images, and a change to a policy module needs none
  # of them. The decision is `tools/ci_gates.py`'s, from the changed paths *and*
  # the branch's slice manifest, and `CI gate` checks that it was honoured.
  #
  # `pytest` deselects the `deployment` marker by default so no contributor needs
  # Docker to run the unit suite; here it is selected explicitly, and the suite
  # fails rather than skips when Docker is absent.
  deployment:
    name: Deployment topology (CORE-S019)
    runs-on: ubuntu-latest
    needs: preflight
    if: fromJSON(needs.preflight.outputs.decisions).deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" && pip install -e client/

      - name: The runner can actually build and run containers
        run: |
          docker version
          docker compose version

      - name: No-bypass, from inside the agent container
        run: pytest -m deployment -q

      # A gate that cannot fail is not a gate — the same argument the Solidity
      # job's mutation step makes, applied to a gate whose subject is a network.
      #
      # The step above asserts a negative: hostile code in the agent container
      # cannot reach the rail. Negatives pass for boring reasons — nothing
      # listening, a container that never started, a name that does not resolve,
      # a harness that stopped probing. `TestTheSuiteIsNotVacuous` rules out the
      # first, but it is an assertion inside the suite being questioned: it can
      # say the addresses were reachable, not that the suite would have noticed a
      # reachable *rail*, because a correct deployment never has one.
      #
      # So this stands up the same deployment with one line added — `railnet` on
      # the agent — and re-runs the real isolation cases, unmodified, requiring
      # them to fail. It runs after the gate rather than before it, and separates
      # them, because a mutation is not a gate: it is the evidence that the gate
      # is one.
      - name: The gate can fail — the same suite against a joined topology
        run: pytest -m deployment_mutation -q

  # The Solidity gates a slice declares as `forge_fmt` and `forge_test`.
  #
  # Conditional: it downloads a pinned Foundry release and an npm tree in order
  # to read `.sol` files, and a change to a Python policy module needs neither.
  # The decision is `tools/ci_gates.py`'s, made from the changed paths *and* the
  # branch's slice manifest, and covered by tests — because an untested `if:`
  # expression that wrongly skips a gate reports the same grey tick as one that
  # rightly does. `CI gate` then refuses any skip that decision did not sanction.
  #
  # Foundry is pinned by version and checksum rather than taken from an action
  # tag, for the same reason gitleaks is below: a verification job that silently
  # changes what it runs is not a verification job. The on-chain workspace is a
  # separate npm project — it pins the exact Safe releases the topology work has
  # to reproduce, and it is deliberately outside the Python distribution.
  onchain:
    name: On-chain verification (Solidity)
    runs-on: ubuntu-latest
    needs: preflight
    if: fromJSON(needs.preflight.outputs.decisions).onchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: onchain/package-lock.json

      - name: Pinned Safe releases
        working-directory: onchain
        run: npm ci --no-audit --no-fund

      - name: Install Foundry
        env:
          FOUNDRY_VERSION: v1.0.0
          FOUNDRY_SHA256: 8c078eaced6bfce76af902def65e36db677842ffbf53f76730647082a5b1e45a
        run: |
          set -euo pipefail
          archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${archive}"
          echo "${FOUNDRY_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          mkdir -p /tmp/foundry
          tar -xzf "/tmp/${archive}" -C /tmp/foundry
          echo "/tmp/foundry" >> "$GITHUB_PATH"

      - name: Solidity formatting
        working-directory: onchain
        run: forge fmt --check

      - name: On-chain topology tests
        working-directory: onchain
        run: forge test -vv

      # A gate that cannot fail is not a gate. This runs the suite once more
      # against a mutated assertion and requires a non-zero exit, so an empty,
      # skipped or silently-not-installed suite cannot be reported as green.
      # It works on a copy: the checked-out tree stays untouched.
      - name: The Solidity gate can fail
        working-directory: onchain
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp -R foundry.toml test node_modules "${scratch}/"
          python3 - "${scratch}" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          target = root / "test" / "topology" / "PinnedReleases.t.sol"
          source = target.read_text(encoding="utf-8")
          mutated = source.replace('"1.4.1", "1.4.1 singleton', '"9.9.9", "1.4.1 singleton')
          if mutated == source:
              sys.exit("FAIL: the mutation did not apply; this check would prove nothing")
          target.write_text(mutated, encoding="utf-8")
          PY
          cd "${scratch}"
          if forge test >/dev/null 2>&1; then
            echo "FAIL: a mutated assertion still passed; the gate is not executing"
            exit 1
          fi
          echo "ok: the gate fails when an assertion is false"

  independence:
    name: Dependency boundary and DCO
    runs-on: ubuntu-latest
    # gitleaks-action reads the commit list of a pull request through the API;
    # without this it fails with a 403 that looks like a scan failure.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: No enterprise dependency in the open-source core
        run: |
          if grep -rn "secondsign_enterprise" --include="*.py" src/; then
            echo "FAIL: core references the enterprise package"
            exit 1
          fi
          echo "ok"

      # Per-file provenance, no absolute path outside the repository, and no
      # dependency nobody declared.
      - name: SPDX and copyright headers
        run: true

      # `--no-merges` is not a loophole: a merge commit carries no authored
      # content to certify, and the commits it brings in are each checked on
      # their own. It is also not optional here. `main` requires branches to be
      # up to date before merging, so "Update branch" is the normal path, and
      # the merge commit GitHub writes for it has no sign-off and no way to
      # acquire one — leaving it in the range fails every branch that takes the
      # supported route to becoming mergeable.
      #
      # The rules, and the message a failure prints, live in the tool — where
      # they are covered by tests. A gate whose logic sits inline in a workflow
      # can only be exercised by pushing a branch that violates it.
      - name: Every commit is signed off (DCO)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_dco.py

      # Pull requests only; the pull request is the gate that matters.
      #
      # gitleaks is run directly rather than through its action, because the
      # action derives its range as `<first-sha>^..<head>`. On a pull request
      # from a fork, the parent of the branch point is not in the checkout, so
      # git refuses the revision, gitleaks scans ~0 bytes, and the step exits
      # non-zero having never run. That fails closed, which is the right
      # direction — but it blocks every external contribution for a reason that
      # has nothing to do with secrets, and a scan that cannot run is not a
      # scan. The same range would also be invalid on the initial commit.
      #
      # `base..head` comes from the event payload and is the range the DCO step
      # above has already resolved on this checkout.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks

          # An empty range would scan nothing and pass, which is the failure
          # mode this step exists to avoid.
          test -n "$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"

          /tmp/gitleaks detect --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  package:
    name: Build and licence report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine pip-licenses
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: LICENSE ships in the distribution
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("LICENSE") for n in names):
              sys.exit(f"FAIL: no LICENSE in {wheel.name}")
          print("ok:", wheel.name)
          PY
      # Two things this step gets wrong if written the obvious way.
      #
      # First, it must inspect what the *distribution* pulls in, not what the CI
      # job happens to have installed. Running it in the build environment
      # reported docutils — a dependency of twine, not of this package — and a
      # licence gate that fails on its own tooling gets switched off within a
      # week.
      #
      # Second, a multi-licence string like "BSD License; GPL; Public Domain"
      # means the user may choose. Substring-matching "GPL" across the whole
      # string treats an offer as an obligation and rejects a package anyone may
      # use under BSD. Split, then reject only if *every* option is blocked.
      - name: Dependency licences
        run: |
          python -m venv /tmp/licence-env
          /tmp/licence-env/bin/pip install --quiet --upgrade pip pip-licenses
          /tmp/licence-env/bin/pip install --quiet dist/*.whl
          /tmp/licence-env/bin/pip-licenses --format=json \
            --ignore-packages pip setuptools wheel pip-licenses prettytable wcwidth tomli \
            > licenses.json
          python - <<'PY'
          import json, sys

          BLOCKED = ("AGPL", "SSPL", "BUSL", "UNKNOWN")
          # LGPL is permitted for dynamically linked use; bare "GPL" is not.
          def blocked(option: str) -> bool:
              text = option.strip().upper()
              if not text:
                  return True
              if "LGPL" in text:
                  return False
              if any(marker in text for marker in BLOCKED):
                  return True
              return "GPL" in text

          bad = []
          for package in json.load(open("licenses.json")):
              declared = package["License"] or "UNKNOWN"
              options = [part for part in declared.split(";") if part.strip()]
              if options and all(blocked(option) for option in options):
                  bad.append((package["Name"], declared))

          for name, declared in bad:
              print(f"policy-incompatible: {name} — {declared}")
          if not bad:
              print("ok: every dependency offers a permissive licence")
          sys.exit(1 if bad else 0)
          PY

  # The one required status check on `main`.
  #
  # `if: always()` so it runs even when something above it failed — a gate that
  # is itself skipped whenever a job fails would report nothing, which is the
  # exact shape of the problem it exists to catch.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [preflight, tests, onchain, deployment, independence, package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No `pip install`. This is the last check standing between a silent skip
      # and a merge; it depends on the standard library and nothing else, so it
      # cannot fail — or pass — for a reason unrelated to what it is checking.
      - name: Every job that had to run, ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DECISIONS: ${{ needs.preflight.outputs.decisions }}
        run: python tools/ci_gates.py verify
