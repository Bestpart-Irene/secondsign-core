name: CI

# Every gate a slice can declare runs here. A contributor should never have to
# ask whether a change is acceptable: if CI is green and the slice manifest
# validates, the security boundary is intact by construction.
#
# Every action is pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer its owner can move, so `@v4` names whatever that account publishes
# next — and these jobs decide whether a change to a payment authorization
# boundary is safe to merge. Foundry and gitleaks below were already pinned by
# version and checksum on exactly this reasoning; the actions were the
# inconsistency. The trailing comment records the intended version so Dependabot
# can still propose upgrades, as a reviewable diff rather than silently.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, boundaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src

      - name: Tests (unit, properties, contracts, conformance, architecture)
        run: pytest --cov=secondsign --cov-report=term-missing --cov-fail-under=90

      - name: Import and architecture boundaries
        run: lint-imports

      - name: Slice manifests
        run: python tools/validate_slice.py docs/slices/roadmap.yaml

      # The manifest already promises which files a slice may touch. Checking
      # that promise mechanically is what stops "while I was in there" changes
      # arriving on a decision path inside a PR that says something else.
      - name: Declared slice scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
          python tools/check_slice_scope.py

  # The Solidity gates a slice declares as `forge_fmt` and `forge_test`.
  #
  # Foundry is pinned by version and checksum rather than taken from an action
  # tag, for the same reason gitleaks is below: a verification job that silently
  # changes what it runs is not a verification job. The on-chain workspace is a
  # separate npm project — it pins the exact Safe releases the topology work has
  # to reproduce, and it is deliberately outside the Python distribution.
  onchain:
    name: On-chain verification (Solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: onchain/package-lock.json

      - name: Pinned Safe releases
        working-directory: onchain
        run: npm ci --no-audit --no-fund

      - name: Install Foundry
        env:
          FOUNDRY_VERSION: v1.0.0
          FOUNDRY_SHA256: 8c078eaced6bfce76af902def65e36db677842ffbf53f76730647082a5b1e45a
        run: |
          set -euo pipefail
          archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${archive}"
          echo "${FOUNDRY_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          mkdir -p /tmp/foundry
          tar -xzf "/tmp/${archive}" -C /tmp/foundry
          echo "/tmp/foundry" >> "$GITHUB_PATH"

      - name: Solidity formatting
        working-directory: onchain
        run: forge fmt --check

      - name: On-chain topology tests
        working-directory: onchain
        run: forge test -vv

      # A gate that cannot fail is not a gate. This runs the suite once more
      # against a mutated assertion and requires a non-zero exit, so an empty,
      # skipped or silently-not-installed suite cannot be reported as green.
      # It works on a copy: the checked-out tree stays untouched.
      - name: The Solidity gate can fail
        working-directory: onchain
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp -R foundry.toml test node_modules "${scratch}/"
          python3 - "${scratch}" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          target = root / "test" / "topology" / "PinnedReleases.t.sol"
          source = target.read_text(encoding="utf-8")
          mutated = source.replace('"1.4.1", "1.4.1 singleton', '"9.9.9", "1.4.1 singleton')
          if mutated == source:
              sys.exit("FAIL: the mutation did not apply; this check would prove nothing")
          target.write_text(mutated, encoding="utf-8")
          PY
          cd "${scratch}"
          if forge test >/dev/null 2>&1; then
            echo "FAIL: a mutated assertion still passed; the gate is not executing"
            exit 1
          fi
          echo "ok: the gate fails when an assertion is false"

  independence:
    name: Dependency boundary and DCO
    runs-on: ubuntu-latest
    # gitleaks-action reads the commit list of a pull request through the API;
    # without this it fails with a 403 that looks like a scan failure.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: No enterprise dependency in the open-source core
        run: |
          if grep -rn "secondsign_enterprise" --include="*.py" src/; then
            echo "FAIL: core references the enterprise package"
            exit 1
          fi
          echo "ok"

      # Per-file provenance, no absolute path outside the repository, and no
      # dependency nobody declared.
      - name: SPDX and copyright headers
        run: true

      # `--no-merges` is not a loophole: a merge commit carries no authored
      # content to certify, and the commits it brings in are each checked on
      # their own. It is also not optional here. `main` requires branches to be
      # up to date before merging, so "Update branch" is the normal path, and
      # the merge commit GitHub writes for it has no sign-off and no way to
      # acquire one — leaving it in the range fails every branch that takes the
      # supported route to becoming mergeable.
      - name: Every commit is signed off (DCO)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then echo "not a pull request; skipping"; exit 0; fi
          missing=0
          for sha in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qi "^Signed-off-by:"; then
              echo "missing DCO sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          exit $missing

      # Pull requests only; the pull request is the gate that matters.
      #
      # gitleaks is run directly rather than through its action, because the
      # action derives its range as `<first-sha>^..<head>`. On a pull request
      # from a fork, the parent of the branch point is not in the checkout, so
      # git refuses the revision, gitleaks scans ~0 bytes, and the step exits
      # non-zero having never run. That fails closed, which is the right
      # direction — but it blocks every external contribution for a reason that
      # has nothing to do with secrets, and a scan that cannot run is not a
      # scan. The same range would also be invalid on the initial commit.
      #
      # `base..head` comes from the event payload and is the range the DCO step
      # above has already resolved on this checkout.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks

          # An empty range would scan nothing and pass, which is the failure
          # mode this step exists to avoid.
          test -n "$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"

          /tmp/gitleaks detect --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  package:
    name: Build and licence report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine pip-licenses
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: LICENSE ships in the distribution
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("LICENSE") for n in names):
              sys.exit(f"FAIL: no LICENSE in {wheel.name}")
          print("ok:", wheel.name)
          PY
      # Two things this step gets wrong if written the obvious way.
      #
      # First, it must inspect what the *distribution* pulls in, not what the CI
      # job happens to have installed. Running it in the build environment
      # reported docutils — a dependency of twine, not of this package — and a
      # licence gate that fails on its own tooling gets switched off within a
      # week.
      #
      # Second, a multi-licence string like "BSD License; GPL; Public Domain"
      # means the user may choose. Substring-matching "GPL" across the whole
      # string treats an offer as an obligation and rejects a package anyone may
      # use under BSD. Split, then reject only if *every* option is blocked.
      - name: Dependency licences
        run: |
          python -m venv /tmp/licence-env
          /tmp/licence-env/bin/pip install --quiet --upgrade pip pip-licenses
          /tmp/licence-env/bin/pip install --quiet dist/*.whl
          /tmp/licence-env/bin/pip-licenses --format=json \
            --ignore-packages pip setuptools wheel pip-licenses prettytable wcwidth tomli \
            > licenses.json
          python - <<'PY'
          import json, sys

          BLOCKED = ("AGPL", "SSPL", "BUSL", "UNKNOWN")
          # LGPL is permitted for dynamically linked use; bare "GPL" is not.
          def blocked(option: str) -> bool:
              text = option.strip().upper()
              if not text:
                  return True
              if "LGPL" in text:
                  return False
              if any(marker in text for marker in BLOCKED):
                  return True
              return "GPL" in text

          bad = []
          for package in json.load(open("licenses.json")):
              declared = package["License"] or "UNKNOWN"
              options = [part for part in declared.split(";") if part.strip()]
              if options and all(blocked(option) for option in options):
                  bad.append((package["Name"], declared))

          for name, declared in bad:
              print(f"policy-incompatible: {name} — {declared}")
          if not bad:
              print("ok: every dependency offers a permissive licence")
          sys.exit(1 if bad else 0)
          PY
