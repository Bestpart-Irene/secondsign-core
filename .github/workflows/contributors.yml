name: Contributors

# Keeps CONTRIBUTORS.md matching the history without asking anyone to remember.
#
# It runs after the merge, never on the pull request. Running it as a gate would
# mean a first-time contributor's own pull request fails because the file does
# not yet name them — the project telling a new person their contribution is
# wrong at the exact moment it is most welcome. Refreshing afterwards has the
# same end state and none of that.
#
# Nothing here pushes to `main`. It opens a pull request like anyone else, which
# keeps branch protection meaningful: an automated commit gets the same CI and
# the same human merge as a written one.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the contributor list
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The full history, or the tool sees one author and refuses to judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Regenerate from the history
        run: python tools/render_contributors.py

      - name: Open a pull request if someone new arrived
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/contributors-refresh
        run: |
          set -euo pipefail

          if git diff --quiet -- CONTRIBUTORS.md; then
            echo "The list already matches the history."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The sign-off is the same mechanical assertion Dependabot's commits
          # carry: this content came from this repository's own history, and the
          # account making that statement is named. It certifies nothing about
          # anyone else's contribution, and the tool it comes from is reviewed
          # like any other file here.
          git checkout -B "$BRANCH"
          git add CONTRIBUTORS.md
          git commit -s -m "chore(contributors): refresh from the history" -m \
            "Generated by tools/render_contributors.py. A new contributor landed
          a commit on main, so the list moved. No hand-edited content."
          git push --force-with-lease origin "$BRANCH"

          # A refresh may already be open and unmerged; force-pushing updates it
          # rather than opening a second pull request for the same file.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(contributors): refresh the contributor list" \
              --body "$(printf '%s\n' \
                'Someone new landed a commit on `main`, so `CONTRIBUTORS.md` moved.' \
                '' \
                'Generated by `tools/render_contributors.py` from the Git history of' \
                '`main`, in order of first commit. Nothing here is hand-written, and' \
                'nobody had to add themselves.' \
                '' \
                'If a name looks wrong or doubled, the fix is `.mailmap` rather than' \
                'this file — one entry there corrects the attribution everywhere at' \
                'once, including GitHub'"'"'s own blame.')"
          fi
