name: Derived files

# Two files in this repository are generated, not written: `CONTRIBUTORS.md`
# from the Git history, and `docs/slices/STATUS.md` from the roadmap and the
# history. Both are committed only so they render on GitHub. This keeps them
# matching without asking anyone to remember.
#
# It runs after the merge, never on the pull request, and for both files the
# reason is that **neither can be correct on the branch that changes it**:
#
# - `CONTRIBUTORS.md` does not yet name a first-time contributor. Gating on it
#   would mean their own pull request fails for not listing them — the project
#   telling a new person their contribution is wrong at the moment it is most
#   welcome.
# - `STATUS.md` derives completion from the *merge commit* of a slice branch,
#   which does not exist until the pull request merges. A branch cannot contain
#   the commit that merges it. `main` therefore goes stale the instant a slice
#   lands, every time, and no amount of care on the contributor's part can
#   prevent it. That is a refresh job, not a gate — CI checks the file on pull
#   requests, where the question is answerable and a hand-edit is what it
#   catches.
#
# Nothing here pushes to `main`. It opens a pull request like anyone else, which
# keeps branch protection meaningful: an automated commit gets the same CI and
# the same human merge as a written one.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derived
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the generated files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The full history, or the tools see one author and no merged slice, and
      # refuse to judge.
      #
      # The token matters more than it looks, and there are two separate ways
      # the default one is not enough.
      #
      # First: without either `CONTRIBUTORS_TOKEN` or the "Allow GitHub Actions
      # to create and approve pull requests" setting, `gh pr create` fails
      # outright with "GitHub Actions is not permitted to create or approve pull
      # requests". That is a red `main` for a reason with nothing to do with the
      # code, and it is what happened on this repository's first external slice
      # contribution — the new contributor's name simply never landed.
      #
      # Second, and the reason the setting is deliberately left off: events made
      # with the default `GITHUB_TOKEN` do not start workflow runs, and the one
      # documented exception does not help here. A pull request it opens creates
      # runs in an **approval-required** state — they exist, they report nothing,
      # and somebody has to press "Approve and run" before any check completes.
      # A refresh that waits for a human is not a refresh, and until that click
      # the pull request cannot satisfy branch protection.
      # https://docs.github.com/en/actions/concepts/security/github_token
      #
      # `CONTRIBUTORS_TOKEN` is a fine-grained personal access token scoped to
      # this repository alone, with Contents: read and write and Pull requests:
      # read and write, and nothing else. With it the refresh behaves like any
      # maintainer's pull request: CI starts on its own. The wider "create and
      # approve pull requests" permission is not taken, because automation has no
      # business approving its own work and this needs only the narrow grant.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CONTRIBUTORS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Regenerate from the history
        run: |
          python -m pip install --quiet pyyaml
          python tools/render_contributors.py
          python tools/render_roadmap.py

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: chore/refresh-derived
        run: |
          set -euo pipefail

          generated=(CONTRIBUTORS.md docs/slices/STATUS.md)

          if git diff --quiet -- "${generated[@]}"; then
            echo "Both files already match the repository."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The sign-off is the same mechanical assertion Dependabot's commits
          # carry: this content came from this repository's own history, and the
          # account making that statement is named. It certifies nothing about
          # anyone else's contribution, and the tools it comes from are reviewed
          # like any other file here.
          git checkout -B "$BRANCH"
          git add "${generated[@]}"
          git commit -s -m "chore(derived): refresh the generated files" -m \
            "Generated by tools/render_contributors.py and tools/render_roadmap.py.
          Something landed on main that these files derive from. No hand-edited
          content."
          git push --force-with-lease origin "$BRANCH"

          # A refresh may already be open and unmerged; force-pushing updates it
          # rather than opening a second pull request for the same files.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "chore(derived): refresh the generated files" \
              --body "$(printf '%s\n' \
                'Something landed on `main` that `CONTRIBUTORS.md` or' \
                '`docs/slices/STATUS.md` derives from, so one of them moved.' \
                '' \
                'Generated by `tools/render_contributors.py` and' \
                '`tools/render_roadmap.py`. Nothing here is hand-written: nobody had' \
                'to add themselves to the contributor list, and nobody had to' \
                'remember to mark a slice complete.' \
                '' \
                '`STATUS.md` can only move after the merge. A slice counts as' \
                'complete when trunk contains the merge of its branch, and a branch' \
                'cannot contain the commit that merges it — so this refresh is the' \
                'only place that edit can correctly happen.' \
                '' \
                'If a name looks wrong or doubled, the fix is `.mailmap` rather than' \
                'the contributor list — one entry there corrects the attribution' \
                'everywhere at once, including GitHub'"'"'s own blame.' \
                '' \
                '---' \
                '' \
                'If this pull request'"'"'s checks are waiting for approval rather than' \
                'running, the repository has no `CONTRIBUTORS_TOKEN` secret and it was' \
                'opened with the default token, whose pull requests create runs in an' \
                'approval-required state. Press "Approve and run" this once, then add' \
                'the token — see the workflow comment.')"
          fi
