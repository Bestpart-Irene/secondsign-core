name: Release

# A release is a tag, and nothing else. Pushing `v0.1.0` builds the artefacts
# from that exact commit and publishes them; there is no local `twine upload`
# step anyone can run differently, and no API token stored anywhere. PyPI
# authenticates the workflow itself through OIDC (trusted publishing), so a
# leaked repository secret cannot be used to publish a release.
#
# Every action is pinned to a commit SHA, not a tag. A tag is a moving pointer
# its owner can repoint at any time, so `@v4` means "whatever that account
# publishes next" — and this workflow has permission to sign and upload the
# artefact users install to authorize payments. Foundry and gitleaks are already
# pinned by version and checksum in ci.yml for the same reason; leaving the
# actions on tags left the softest link in the chain closest to the release.
# The trailing `# v4` comment records intent so Dependabot can still offer
# upgrades, which arrive as a reviewable diff rather than silently.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    # Narrower than it looks: `id-token` signs the attestation through OIDC and
    # mints nothing reusable, and `attestations` writes only that record. Neither
    # grants any ability to publish — that stays with the `pypi` environment and
    # its required reviewer, one job further on.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      # The tag is a claim about the version. If it disagrees with the package,
      # the disagreement must stop the release, not survive it on PyPI forever —
      # a version can never be re-uploaded once taken.
      - name: The tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/secondsign/__init__.py").read_text()).group(1))')"
          echo "tag=$tag packaged=$packaged"
          test "$tag" = "$packaged"

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      # The wheel is what users get. Install it in a clean environment and
      # confirm the public path imports with no development extras present.
      - name: The wheel installs and imports on its own
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import secondsign
          from secondsign.contracts import PluginJudgement, PolicyView  # noqa: F401
          from secondsign.decision import DecisionEngine  # noqa: F401
          from secondsign.gateway import ExecutionGateway  # noqa: F401
          print("ok", secondsign.__version__)
          PY

      # Signed provenance for the exact files that reach PyPI: which workflow,
      # at which commit, produced this wheel. It is what lets someone verify
      # that the artefact they installed came from this repository rather than
      # from an account takeover, without taking the project's word for it —
      # `gh attestation verify dist/secondsign_core-*.whl --repo <owner>/<repo>`.
      #
      # Attesting before upload is the point. An attestation generated after
      # publication would describe a file that had already been trusted.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC, in place of an API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: distribution, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    # A GitHub environment with a required reviewer is the last human checkpoint
    # before an irreversible upload. Configure it in Settings → Environments.
    environment:
      name: pypi
      url: https://pypi.org/p/secondsign-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: distribution, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
