# Pinning every action to a commit SHA removes the silent-upgrade risk and
# replaces it with a staleness one: a pinned action never picks up its own
# security fixes. Dependabot is the other half of that trade — it proposes the
# new SHA as a pull request, which runs the full gate suite and gets read by a
# person, instead of the change arriving between two runs of the same workflow.
#
# Grouped into one pull request per ecosystem per week. Six separate bumps is
# how a maintainer learns to merge them without reading, which would give back
# the property the pinning was for.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # The Python dependency set is small and deliberately pinned exactly in
  # `[dev]`, so this is mostly about learning that a pin has a published
  # advisory — not about tracking latest.
  #
  # Two groups, not one, and the split is about attribution rather than tidiness.
  # A linter release is a *policy* change: new rules arrive enabled, and the
  # bump lands red for reasons that have nothing to do with this repository's
  # code. Grouped with pytest and pydantic, that red PR states "2 updates" and
  # the reviewer has to bisect which of them caused 25 findings before they can
  # judge either. The first such bump (#41: ruff 0.15 → 0.16, EXE001 and others)
  # is exactly that PR.
  #
  # Separated, a linter bump is a self-contained question — adopt the new rules,
  # or pin against them — and a pydantic advisory is never queued behind it.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      lint-policy:
        patterns: ["ruff", "mypy", "import-linter"]
      python:
        patterns: ["*"]
        exclude-patterns: ["ruff", "mypy", "import-linter"]
    commit-message:
      prefix: "chore(deps)"

  # The on-chain workspace pins the exact Safe releases the topology work has to
  # reproduce. An upgrade there changes what the verification means, so it is
  # deliberately a decision rather than a routine bump — open a slice, do not
  # merge a bot's diff.
  - package-ecosystem: npm
    directory: /onchain
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
