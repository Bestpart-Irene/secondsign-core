# The public build plan.
#
# This is the queue any contributor — human or agent — can pick from. Status
# is derived from Git, not stored here: a slice is complete when its
# acceptance tests exist and pass on the default branch. That keeps the plan
# declarative and stops it drifting from reality.
#
# Validate with: python tools/validate_slice.py docs/slices/roadmap.yaml
#
# This roadmap covers engineering only. Commercial planning is not public.

schema_version: 1

slices:
  - id: CORE-S001
    title: Initialize the core repository
    depends_on: []
    threats: []
    scope: ["*"]
    forbidden: []
    acceptance:
      - history begins at this repository's own initial commit
      - DCO enforced from the first commit
    required_tests: []
    gates: [ruff_check, ruff_format]
    stop_for_human: false

  - id: CORE-S002
    title: Policy plugin contract candidate
    depends_on: [CORE-S001]
    threats: [A5, A9]
    scope: ["src/secondsign/contracts/**", "tests/contracts/**"]
    forbidden: [free-form mappings, raw account identifiers]
    acceptance:
      - closed immutable boundary models
      - plugins have no approval vocabulary
      - combination is monotone and property-tested
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S003
    title: Public contribution protocol and conformance kit
    depends_on: [CORE-S002]
    threats: [A5, A8, A9]
    scope: ["docs/**", "src/secondsign/conformance/**", "tests/architecture/**", "tests/conformance/**", "tools/**", ".github/**"]
    forbidden: [dependence on any private repository for build rules]
    acceptance:
      - invariants are documented and each is bound to an enforcing test
      - a third party can certify an extension by inheriting one suite
      - the conformance kit demonstrably rejects non-conformant extensions
      - plugin failure resolves to DENY
    required_tests: [architecture, conformance]
    gates: [ruff_check, ruff_format, pytest, lint_imports, validate_slices]
    stop_for_human: false

  - id: CORE-S004
    title: Structured explanations and full determinism on the plugin boundary
    depends_on: [CORE-S003]
    threats: [A5, A9]
    scope: ["src/secondsign/contracts/**", "tests/contracts/**"]
    forbidden: [free text on a boundary model]
    acceptance:
      - explanation becomes a closed structured form; no arbitrary text crosses the boundary
      - identical inputs produce byte-identical results including reason ordering
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S005
    title: Freeze Policy Plugin API v1
    depends_on: [CORE-S004]
    threats: [A9]
    scope: ["src/secondsign/contracts/**", "docs/**", "tests/architecture/**"]
    forbidden: []
    acceptance:
      - contract version pinned and compatibility policy published
      - ratchet tests cover every published symbol
    required_tests: [architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: true
    checkpoint_reason: public API freeze

  - id: CORE-S006
    title: Decision dimensions and closed PaymentPayload
    depends_on: [CORE-S005]
    threats: [A5, A6]
    scope: ["src/secondsign/intent/**", "tests/intent/**"]
    forbidden: [free-form mappings, raw account identifiers, floating-point money]
    acceptance:
      - value is a band, not a scalar
      - rail payloads are a closed union
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S007
    title: TransactionIntent and versioned IntentDigest
    depends_on: [CORE-S006]
    threats: [B1, B2]
    scope: ["src/secondsign/intent/**", "tests/intent/**"]
    forbidden: [free-form mappings]
    acceptance:
      - digest covers every material field and is deterministic, total and versioned
      - any field change changes the digest
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S008
    title: Rail adapter contract and conformance suite, with a Stripe mapping
    depends_on: [CORE-S007]
    threats: [A1, A5, B9]
    scope: ["src/secondsign/adapters/**", "src/secondsign/conformance/**", "tests/adapters/**"]
    forbidden: [network calls in this slice, caller-supplied idempotency keys]
    acceptance:
      - a tool call maps to a TransactionIntent
      - idempotency key is derived by the adapter, never accepted from the caller
      - source trust can only be downgraded
      - RailAdapterConformance exists and the Stripe mapping passes it
    required_tests: [unit, conformance, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S009
    title: Amount and sliding-window aggregate policy
    depends_on: [CORE-S008]
    threats: [B4, A3, A4]
    scope: ["src/secondsign/policy/**", "tests/policy/**"]
    forbidden: [natural-day or natural-hour window boundaries]
    acceptance:
      - limits judged on a sliding-window aggregate; a single transaction is the special case
      - missing context falls back to the strictest default, never to some other policy
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S010
    title: DecisionEngine with combination law property tests
    depends_on: [CORE-S009]
    threats: [A9, A7]
    scope: ["src/secondsign/decision/**", "tests/decision/**"]
    forbidden: []
    acceptance:
      - ALLOW / REVIEW / DENY, monotone by construction
      - evaluation failure resolves to DENY
      - every non-ALLOW carries stable reason codes
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S011
    title: Digest-bound MakerChecker and approval provider contract
    depends_on: [CORE-S010]
    threats: [B2, B3, B6]
    scope: ["src/secondsign/approval/**", "src/secondsign/conformance/**", "tests/approval/**"]
    forbidden: [approvals bound to an agent, session, or action type]
    acceptance:
      - approval binds to one digest, is one-shot, and expires
      - a missing expiry is treated as expired
      - maker and checker identities are distinct types
      - ApprovalProviderConformance exists
    required_tests: [unit, properties, conformance, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S012
    title: Idempotency reservation and three-state ExecutionGateway
    depends_on: [CORE-S011]
    threats: [B1, B2, B8, B7]
    scope: ["src/secondsign/gateway/**", "tests/gateway/**"]
    forbidden: [accepting caller parameters at the gateway]
    acceptance:
      - gateway accepts only the decision-carried intent
      - digest re-verified immediately before dispatch
      - idempotency reserved before execution, not recorded after
      - outcome is success / failure / unknown; unknown is not failure
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S013
    title: Fail-closed hash-chained AuditReceipt and audit sink contract
    depends_on: [CORE-S012]
    threats: [A7, A1, A5]
    scope: ["src/secondsign/audit/**", "src/secondsign/conformance/**", "tests/audit/**"]
    forbidden: [raw values in receipts, silently dropped writes]
    acceptance:
      - every non-ALLOW path produces a receipt, including error and degraded paths
      - audit write failure is itself fail-closed
      - chain break is detectable
      - AuditSinkConformance exists
    required_tests: [unit, properties, conformance, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S014
    title: Stripe end-to-end demonstration
    depends_on: [CORE-S013]
    threats: [B1, B2, A7]
    scope: ["src/secondsign/**", "tests/e2e/**", "pyproject.toml"]
    forbidden: [committed credentials]
    acceptance:
      - a test-mode transfer is held, approved, released
      - a redacted hash-chained receipt links decision, approval and outcome
    required_tests: [e2e]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: true
    checkpoint_reason: external credentials and first outbound call

  - id: CORE-S015
    title: Alpaca adapter — abstraction falsification
    depends_on: [CORE-S014]
    threats: [B5, A6]
    scope: ["src/secondsign/adapters/**", "src/secondsign/intent/**", "tests/adapters/**", "tests/intent/**"]
    forbidden: [changing the decision layer to accommodate a rail]
    acceptance:
      - TradePayload added without changing the decision layer
      - market session and quote validity enforced
    required_tests: [unit, conformance, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: true
    checkpoint_reason: external credentials; a failed falsification is a design decision
    rationale: >
      If the decision layer needs to change to accept a brokerage rail, the
      intent abstraction is wrong and must be redone rather than patched. That
      outcome is why this slice exists.

  - id: CORE-S016
    title: Red-team matrix expansion
    depends_on: [CORE-S015]
    threats: [A2, A3, B2, B3, B4, B6, B7]
    scope: ["tests/redteam/**"]
    forbidden: []
    acceptance:
      - control-plane and approval-replay groups written RED first
      - approval-rate budget measured
    required_tests: [redteam]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  - id: CORE-S017
    title: Structural control-plane isolation from the managed agent
    depends_on: [CORE-S013]
    threats: [A2, A3]
    scope:
      - src/secondsign/**
      - tests/architecture/**
      - pyproject.toml
      - docs/INVARIANTS.md
    forbidden:
      - the managed-agent surface importing any control-plane module
      - an isolation decision that reads a configurable setting
      - a control-plane concern held by a module the classification does not cover
      - a relaxation that takes effect without a matching, unexpired, approved record
    acceptance:
      - limits, approver roster, idempotency store, audit ledger and fingerprint keys are unreachable from the managed-agent surface by import structure, enforced by lint-imports and an architecture test that discovers modules rather than naming them
      - the isolation judgement depends on no configurable policy — there is no setting whose value can make a control-plane module reachable
      - reading any setting looser than the strictest default requires a matching, unexpired, approved ledger record; absent that, resolution falls back to strictest (a missing expiry counts as expired)
      - INV-12's enforcement column names this slice's tests, replacing the CORE-S017 placeholder
    required_tests: [architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: true
    checkpoint_reason: >
      Marquee isolation invariant (INV-12). A human must confirm the guarantee
      is structural and depends on no configurable policy before it is marked
      complete — a control that a setting can switch off is not this control.
    rationale: >
      INV-12 already names CORE-S017 as its enforcer, but the slice was never
      queued: the roadmap stopped at CORE-S016, leaving the control-plane-
      unreachability invariant with no slice to build it. Structural precondition
      is the control-plane components existing (approvals CORE-S011, gateway/
      idempotency CORE-S012, audit ledger CORE-S013); it deliberately does not
      depend on the external-rail demonstrations (CORE-S014/S015).

  - id: CORE-S018
    title: Extension health and a declared degraded state
    depends_on: [CORE-S010]
    threats: [A8]
    scope:
      - src/secondsign/health/**
      - src/secondsign/decision/**
      - tests/health/**
      - tests/decision/**
    forbidden:
      - a degraded state that permits an action that would otherwise be denied
      - resolving an unavailable extension to anything other than the strictest path
      - softening any verdict to preserve availability
    acceptance:
      - repeated failure or timeout of an extension surfaces as an operator-visible health signal, distinct from the per-decision DENY it already produces
      - the system can enter a declared degraded state that is observable, and entering it never lowers any verdict — a degraded extension's failures still resolve to DENY, so INV-1 is preserved unchanged
      - property test:  for every view, the decision under a degraded state is never weaker than the decision under a healthy state
      - degraded state changes observability and operator signalling, never the decision
    required_tests: [unit, properties, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: true
    checkpoint_reason: >
      Sits adjacent to the availability / fail-closed tradeoff (INV-1). A human
      must confirm the degraded state introduces no bypass and softens no
      verdict — the whole point is to answer the availability objection without
      weakening the guarantee.
    rationale: >
      INV-1's discussion names "operator-visible extension health and a declared
      degraded state" as the correct answer to the availability objection, but no
      slice built it — the same gap CORE-S017 had. As the plugin ecosystem grows,
      the aggregate availability of a fail-closed chain falls with the number of
      extensions, so this becomes thesis-critical for bank-scale adoption rather
      than a convenience.

  - id: CORE-S019
    title: Standalone gateway process and a credential-free agent-side client
    depends_on: [CORE-S017]
    threats: [A2, A3]
    scope:
      - src/secondsign/**
      - client/**
      - deploy/**
      - tests/redteam/**
      - tests/architecture/**
      - tests/audit/**
      - tests/client/**
      - tests/conformance/**
      - tests/deployment/**
      - tests/e2e/**
      - tests/gateway/**
      - tests/rails/**
      - docs/**
      - tools/**
      - tests/tooling/**
      - pyproject.toml
      - .github/workflows/**
    forbidden:
      - a rail credential reachable from the managed agent's process
      - a network route from the managed agent to the rail that does not pass through the gateway
      - a process boundary that a configuration setting can collapse
      - the client distribution depending on secondsign-core, or on anything but pydantic
      - a gateway or rail module reachable from an environment with only the client installed
      - a wire version mismatch resolved by best-effort parsing rather than refusal
      - the client returning any local verdict when the gateway is unreachable
      - describing the absence of a module as the no-bypass boundary rather than as one term of it
      - a no-bypass claim demonstrated only by running the sanctioned client, rather than by adversarial code
      - a non-loopback listener that authenticates no peer, or that relies on an operator declaration alone
      - a deployment precondition presented as an enforced guarantee, or omitted from the residual-risk statement
      - a ClientPrincipal that can become a MakerIdentity or a CheckerIdentity, or that grants any permission
      - a principal read from a request body, or a body-supplied principal accepted and ignored rather than refused
      - an idempotency namespace an agent can choose, or a reservation key omitting the authenticated principal
      - a committed private key, or test key material delivered by environment variable rather than read-only mount
      - a certificate accepted without expiry, a setting that disables time validation, or a client leaf accepted beyond 24 hours
      - claiming the agent container holds no credential, when it holds its own client key
      - describing the absence of CRL or OCSP as anything other than "no online revocation; a leaked certificate stays valid until it expires"
    acceptance:
      - the gateway runs as its own process, reachable from the managed agent only through the authorization request it serves
      - an integration test starts that process, drives an execution through the agent-side client, and asserts the client holds no rail credential at any point
      - with the gateway process stopped, the agent-side client cannot reach the rail at all — execution becomes impossible rather than merely unauthorized
      - the boundary depends on no configurable setting, and a red-team case asserts that no setting collapses it
      # The shape agreed at this checkpoint, recorded in ADR 0003. Each line is
      # stated so a test settles it rather than a reviewer judging it.
      - the agent-side client ships as its own distribution whose declared dependencies are pydantic alone, asserted against the built wheel's metadata rather than against a requirements list
      - a virtual environment with only the client installed cannot import secondsign.gateway, secondsign.rails, secondsign.approval, secondsign.audit or secondsign.policy, asserted by executing the import and requiring ModuleNotFoundError — recorded as one term of no-bypass, never as the boundary itself
      - the wire contract carries its own version constant, independent of CONTRACT_VERSION, and a client announcing an unrecognised version is refused rather than parsed on a best-effort basis
      - a conformance kit certifies a third-party client against the wire contract, and demonstrably rejects a non-conformant one
      - with the gateway stopped the client yields refused, never a locally computed verdict, and a test asserts no code path in the client can produce completed
      # The conjunction, demonstrated where hostile code actually runs. A package
      # split proves one term; these prove the rest, or the slice is not done.
      - deploy/reference/ carries a two-network topology — agent network and rail network, joined only by the gateway — that an operator can copy, and CI stands it up
      - the adversarial suite runs INSIDE the agent container and is written against the standard library, not against the client, so it tests the environment rather than the sanctioned path
      - adversarial code opening a raw socket or an HTTP connection to the mock rail's address from the agent container fails to connect, and the failure is asserted to be unreachability rather than an authorization refusal
      - from that same container the gateway is reachable, so the test distinguishes a working network from a blocked one and cannot pass by everything being down
      - the gateway container reaches the mock rail, and the rail credential is present in the gateway's environment and absent from the agent's, each asserted by inspection rather than by configuration review
      - with the gateway container stopped, no path from the agent container reaches the rail — neither through the client nor through the standard library — and the mock rail records zero requests for the whole case
      - a case asserts the mock rail received exactly the requests the gateway dispatched and no others, so a bypass that succeeds is detected at the destination rather than inferred from the source
      # ADR 0004. A client certificate authenticates a workload and derives
      # policy scope; it is never an approval identity and never grants
      # permission. Everything here keeps that sentence true.
      - a client certificate authenticates a workload and derives policy scope, and an architecture test asserts no path converts a ClientPrincipal into a MakerIdentity or a CheckerIdentity
      - ClientPrincipal is derived from the TLS session alone; a request carrying or overriding a principal is refused rather than ignored, asserted by a red-team case
      - the principal comes from a single URI SAN, and a certificate with no identity SAN, more than one, a malformed one, or one absent from the allowlist is refused at connection time
      - audit records carry a keyed fingerprint of the principal and never the raw SAN
      - an idempotency reservation binds the authenticated principal together with request_ref and intent_digest, and a red-team case shows one workload cannot consume or collide with another's reservation by choosing its request_ref
      - the gateway refuses to start bound to a non-loopback address unless it has a server certificate, its key, a client CA bundle, client-certificate verification enabled, a minimum TLS version, a derivable principal and fail-closed handling of unknown principals; a red-team case asserts that a server certificate without client verification is refused rather than warned about
      - client leaf validity longer than 24 hours is refused, notBefore/notAfter/key-usage/client-auth EKU are strictly verified, and no setting disables time validation
      - the CA bundle accepts an overlapping old and new CA so rotation needs no downtime, and removing a principal or CA from the allowlist takes effect on restart or atomic reload
      - the reference deployment generates an ephemeral CA and leaves at start-up, commits no private key, delivers them as read-only file mounts, and issues 1-hour client certificates
      - an adversarial case walks the agent container's environment and mounts and finds no gateway key, no CA signing key and no rail credential — while the client private key is present, because claiming the agent holds no credential at all would be false
      - documentation states that a Compose mount demonstrates custody separation and gives no secret-at-rest guarantee, and that there is no online revocation so a leaked certificate stays valid until it expires
      - THREAT_MODEL.md states which terms of no-bypass this software enforces and which are deployment preconditions — network isolation, no package installation combined with egress, no container escape or host privilege, correct credential placement — and names each unenforced term as residual risk
      - documentation nowhere describes ModuleNotFoundError, or the package split alone, as proof that the agent cannot move money
      - KNOWN_GATES and KNOWN_TEST_CATEGORIES gain deployment_topology, and a test asserts the validator rejects an unregistered category so the queue cannot cite a gate that does not run
      - CI proves the deployment gate can fail: it re-runs the adversarial suite against a topology with the two networks joined, and requires the direct-to-rail case to succeed there — a suite that passes because nothing is listening proves nothing
    required_tests: [redteam, architecture, conformance, e2e, deployment_topology]
    gates: [ruff_check, ruff_format, pytest, lint_imports, validate_slices, deployment_topology]
    stop_for_human: true
    checkpoint_reason: >
      The deployment topology is a product-scope commitment: it is what turns
      "no bypass path" from a property of a well-behaved caller into a property
      of the deployment. A human accepts that shape before it is built.
    rationale: >
      README's "Not there yet" already names this as the gap between the library
      today and production custody of money, but no slice carried it, so the
      admission resolved to nothing. CORE-S017 makes the control plane
      unreachable by import structure — the precondition — and this slice makes
      it unreachable by process and network topology, which is the claim the
      threat model actually rests on.

      The deployment shape was agreed at this slice's checkpoint and is recorded
      in ADR 0003: the agent-side client is a separate distribution that does not
      depend on secondsign-core. The reason is that CORE-S017's guarantee is a
      property of this repository rather than of the process an operator runs.
      secondsign.agent cannot import secondsign.gateway, but the agent's process
      can — application code beside the agent may import the gateway directly.
      What stops it today is that the process holds no credential, which is a
      deployment fact this software does not enforce. A separate distribution
      moves the guarantee from "it has no key" to "it has no code", which an
      assessor can verify with a shell and no knowledge of this project.

      The single-distribution sidecar over a Unix socket was the alternative, and
      it satisfies the four original acceptance criteria with zero new
      dependencies. It was rejected because the agent's process still contains
      the rails, so the guarantee stays a fact about deployment; it also excludes
      Windows and does not model the cross-host topology the threat model's "no
      network route to the rail" actually describes. Deferring the split was
      rejected on timing: it is a breaking change whose cost is paid by every
      user who has already imported the agent surface from secondsign-core, and
      that population is currently zero.

      The first draft of this checkpoint called ModuleNotFoundError in the agent
      environment "the boundary". That was an overclaim, corrected before any
      implementation. The absence of a module proves that one process does not
      contain the gateway, and nothing more: an agent can open a socket with the
      standard library, install stripe or secondsign-core, read a misplaced
      credential, or use an egress path the host already has. No-bypass is a
      conjunction — no credential, no route to the rail, only a route to the
      gateway, and no ability to change any of it — and a package split buys one
      term while making two others checkable.

      Hence the deployment_topology criteria. The adversarial suite runs inside
      the agent container and is written against the standard library rather than
      against the client, because a demonstration that the sanctioned client
      behaves correctly tests the sanctioned path and says nothing about an agent
      that has stopped cooperating. Two criteria keep that suite from passing
      vacuously: the gateway must be reachable from the same container, and the
      mock rail must record exactly the gateway's dispatches and no others.

      The two terms this software cannot enforce — network isolation, and the
      absence of package installation combined with egress, container escape or
      host privilege — are deployment preconditions and are required to appear in
      THREAT_MODEL.md as residual risk. A slice that shipped them as guarantees
      would be making the claim this correction exists to prevent.

      Proposed by @EddyJJHuang in pull request #18. Queued here as its own slice,
      with acceptance criteria stated so a test can settle them, rather than
      folded into CORE-S017, whose guarantee is enforceable in-repo today.

  - id: CORE-S021
    title: Explain malformed Fingerprint values without exposing identifiers
    depends_on: [CORE-S005]
    threats: [A5]
    # `tests/intent/**` is in scope because the guarantee is carried by the
    # `Fingerprint` type rather than by any one model that uses it. A test that
    # only reaches it through `secondsign.contracts` would pass while every
    # other holder of a fingerprint leaked the value, which is the failure this
    # slice exists to prevent — so the slice has to be allowed to assert on a
    # second holder. Widened during review of pull request #44, deliberately,
    # rather than by moving the test somewhere it means less.
    scope:
      ["src/secondsign/contracts/**", "tests/contracts/**", "tests/intent/**"]
    forbidden:
      - raw identifier values in validation errors
      - changes to the accepted or rejected Fingerprint value set
      - changes to the frozen secondsign.contracts surface
    acceptance:
      - a malformed Fingerprint error explains that the expected format is fp: followed by 64 hexadecimal characters
      - the error explains that a fingerprint of the identifier is required rather than the identifier itself
      - the offending value is never included in the validation error
      - values accepted and rejected by Fingerprint remain unchanged
      - the malformed Fingerprint error message is pinned by a regression test
      - the frozen secondsign.contracts surface remains unchanged
    required_tests: [unit, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports]
    stop_for_human: false

  # --- On-chain -----------------------------------------------------------
  #
  # A second execution domain: agents that hold a wallet. It has its own threat
  # numbering (C, in ONCHAIN_THREAT_MODEL.md) and its own contract surface,
  # because on-chain risk is a different language rather than a wider version of
  # the financial one. CORE-S020 is what admits these slices to the queue at
  # all; the on-chain queue then starts with a falsification checkpoint rather
  # than a build, because its topology is a claim about external contracts.
  #
  # Only the slices whose acceptance criteria are stable are queued here. The
  # rest stay unqueued until ONCHAIN-S001 answers whether the topology holds —
  # publishing acceptance criteria that rest on an unverified premise would put
  # a promise in the public queue that the design cannot yet keep.

  - id: CORE-S020
    title: Publish the on-chain threat model and admit on-chain slices to the queue
    depends_on: [CORE-S003]
    threats: []
    scope:
      - docs/**
      - tools/**
      - tests/tooling/**
      - onchain/**
      - .github/workflows/**
      - .gitignore
      - README.md
      - CONTRIBUTING.md
    forbidden:
      - commercial positioning, competitive comparison or market claims in a published threat model
      - a contributor instruction that lists "every gate" while omitting one this slice introduces
      - a claim in README or ARCHITECTURE that on-chain execution is supported, rather than designed
      - a queued slice naming a threat id that no published threat model defines
      - a threat-id pattern so wide that an undefined or misspelled id validates
      - a validator that accepts any threat id when the threat model is missing or parses empty
      - a red-team case referenced by count rather than by stable identifier
      - copying expression from any third-party wallet, policy-engine, account-abstraction or simulation implementation
    acceptance:
      - docs/ONCHAIN_THREAT_MODEL.md defines C1 through C14 as `### C<n>` headings, so the same mechanical discovery that reads the financial model reads this one
      - the published on-chain threat model carries its red-team matrix with stable identifiers of the form `C-RT-001`, and nothing references the matrix by case count
      - the published on-chain threat model states its technical assumptions and residual risks, and contains no commercial positioning and no competitive comparison
      - tools/validate_slice.py resolves a C-prefixed threat id against the on-chain model and an A- or B-prefixed id against the financial one; a slice naming an undefined C id fails validation
      - the validator fails closed on a missing or empty threat model rather than accepting every well-formed id
      - a test asserts that an undefined C id, a misspelled prefix, an out-of-range number, a cross-model id and a missing threat-model file are each rejected
      - KNOWN_GATES gains forge_fmt and forge_test; KNOWN_TEST_CATEGORIES gains onchain_topology
      - an onchain/ Foundry workspace pins its Safe releases in a committed lockfile, and CI installs Foundry by pinned version and checksum and runs `forge fmt --check` and `forge test`
      - a smoke test builds both pinned Safe releases in one suite and asserts, by behaviour rather than by reading sources, that module guard configuration exists on the fixed version and not on the earlier one
      - CI proves the Solidity gate can fail: it runs the suite against a mutated assertion on a copy of the workspace and requires a non-zero exit
      - docs/slices/roadmap.yaml still validates, and CI still validates it as the single queue file
      - CONTRIBUTING.md's gate list runs green for a contributor who follows it, on-chain slices included — a list headed "every gate" that omits the Solidity ones would send an external contributor into a red pull request through no fault of their own
      - README's documentation index reaches the published on-chain threat model, and ARCHITECTURE states that on-chain execution is a separate, unimplemented contract surface rather than a capability core has
    required_tests: [unit, architecture, onchain_topology]
    gates: [ruff_check, ruff_format, pytest, forge_fmt, forge_test, validate_slices]
    stop_for_human: true
    checkpoint_reason: >
      Publishing a threat model is irreversible, and this one carries the
      on-chain design's whole risk analysis. A human confirms what is disclosed
      and what is held back before it is public.
    rationale: >
      Depends on CORE-S003 because that slice established the public
      contribution protocol and the slice validator this one extends. No threat
      is declared because it addresses none directly: it is the precondition for
      declaring any of C1 through C14 at all, since the validator rejects the C
      prefix outright until it can resolve one. Publishing the analysis before
      the implementation also keeps the spec-before-implementation commit
      ordering that is this repository's independent-authorship evidence.

  - id: ONCHAIN-S001
    title: Falsify or confirm the double-guard topology on a local chain
    depends_on: [CORE-S020]
    threats: [C3, C11]
    scope:
      - onchain/test/topology/**
      - onchain/foundry.toml
      - docs/**
    forbidden:
      - a production guard or publishable guard artifact under onchain/src
      - asserting the fixed version's repair without also reproducing the earlier version's failure
      - a claim of coverage that rests on reading sources rather than on an executed assertion
      - a mainnet fork, or any RPC endpoint or secret in the verification path
      - mixing the deployment-manifest check into the topology behaviour tests
      - copying expression from Safe's contracts or tests into anything this slice writes
    acceptance:
      - both pinned Safe releases are deployed fresh into one local chain from the committed lockfile, with no mainnet fork and no RPC secret
      - a Safe with a transaction guard installed always invokes the guard on the guarded execution path, asserted by execution
      - on the earlier release, an enabled module clearing the guard succeeds with no guard hook invoked — the failure is reproduced, not described
      - on the fixed release, that same call is refused by the module guard
      - a permanently reverting guard leaves a module-free account unable to execute anything at all, including the call that would remove the guard, demonstrating that no-bypass and recoverability are mutually exclusive on the earlier release
      - deployment, initialisation and both guard configurations complete atomically; until that configuration verifies the account is not marked ready, is not funded, and can take no outbound action — inbound value is treated as a state to handle rather than a possibility to deny
      - a module-path delegatecall is refused by the module guard on the fixed release
      - the submitter identity a guard observes is shown to change with the relayer, and is therefore proven unusable as recovery authority
      - with the transaction guard failing and the module guard sound, a controlled recovery path can restore the transaction guard
      - with the module guard failing and the transaction guard sound, an ordinary account transaction can restore the module guard
      - with both guards reverting permanently the account is still bricked, recorded as the double-failure residual risk rather than presented as solved
      - a separate deployment-manifest check asserts the fixed release is canonical on the target chain, kept out of the topology behaviour tests so a failure in either points at its own cause
      - the report records which assertions executed and which did not, and states that the fixed-version result alone is not evidence
    required_tests: [onchain_topology]
    gates: [ruff_check, ruff_format, forge_fmt, forge_test, validate_slices]
    stop_for_human: true
    checkpoint_reason: >
      A falsification checkpoint, not a build. The whole no-bypass argument rests
      on its answer, and the earlier topology was already falsified once by
      analysis. A human confirms the assertions executed — reproducing the
      earlier version's failure included — before anything depends on them.
    rationale: >
      Fresh local deployment beats a mainnet fork here: historical state is
      irrelevant to topology behaviour, and a fork would add an RPC secret, drift
      and flakiness to the one slice whose entire value is a reproducible answer.
      The recovery-under-guard-failure assertions exist because the second
      revertable guard is a risk this repair introduces, and deferring them would
      mean building on an unmeasured bricking mode. The harness deploys contracts
      itself, which is why the prohibition is on production artifacts under
      onchain/src rather than on deployment as such.

  - id: ONCHAIN-S002
    title: Candidate on-chain verdict types behind an unfrozen version constant
    depends_on: [CORE-S005, CORE-S020]
    threats: [C5, C6]
    scope:
      - src/secondsign/onchain/**
      - tests/onchain/**
    forbidden:
      - importing any on-chain type into secondsign.contracts or any v1 module
      - raising CONTRACT_VERSION, or reusing the v1 version constant for the on-chain surface
      - exporting any on-chain symbol from the top-level secondsign package
      - declaring the on-chain surface frozen, or setting its version constant to 1, in this slice
      - an open or free-form reason-code vocabulary
      - a reason code that no red-team case requires
    acceptance:
      - the on-chain verdict, finding and judgement types exist with their own version constant set to 0, and secondsign.contracts.CONTRACT_VERSION is unchanged at 1
      - the on-chain package is documented as experimental and unfrozen, is not exported from the top-level package, and an architecture test asserts that absence
      - every initial on-chain reason code traces to at least one stably identified red-team case in the on-chain threat model, and a test asserts that direction is total
      - the reason-code vocabulary is closed: an unrecognised code cannot be constructed
      - an architecture test asserts no v1 module imports the on-chain package
      - this slice's tests assert the on-chain version constant is still 0; it reaches 1 only in a later freeze slice
    required_tests: [unit, contracts, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports, validate_slices]
    stop_for_human: false
    rationale: >
      ONCHAIN-S003 requires the strictness laws to be proven over two real
      instances, and the on-chain judgement types do not exist yet —
      generalising first would leave one instance and prove nothing. Depends on
      CORE-S005 because that slice froze Policy Plugin API v1, which is what
      makes a separate on-chain surface necessary rather than a widening of the
      existing one. Version 0 is the point of this slice's shape: the repository
      is public, so "candidate" has to be a structural claim — an unfrozen
      constant and no top-level export — rather than a note in a document, or the
      candidate is depended upon by outsiders the day it merges. Nothing here
      depends on the topology holding, so it can proceed alongside ONCHAIN-S001.

  - id: ONCHAIN-S003
    title: Generalise the strictness algebra in a private kernel without moving the public surface
    depends_on: [CORE-S005, ONCHAIN-S002]
    threats: [A9]
    scope:
      - src/secondsign/_strictness/**
      - src/secondsign/contracts/**
      - src/secondsign/onchain/**
      - tests/contracts/**
      - tests/onchain/**
      - tests/architecture/**
      - pyproject.toml
    forbidden:
      - a change to the public signature, return type or serialised result of contracts.combine, contracts.neutral or the decision engine
      - a type parameter appearing anywhere in the published v1 surface
      - the private kernel being imported from outside contracts, decision or onchain
      - a second copy of the combination laws for the on-chain domain
      - proving the laws over one instance and asserting they hold for both
      - relaxing or re-recording a frozen signature to make the generalisation fit
    acceptance:
      - the combination laws are stated once over a type parameter in a private kernel and instantiated twice, and the four property tests run against both the v1 and the on-chain instance as real instances rather than stubs
      - the contract surface ratchet keeps passing unchanged across the generalisation, with no frozen signature re-recorded — the ratchet already locks the published callables, so it is the pre-existing guard this slice must satisfy rather than one it writes
      - the serialised result of a v1 combination is unchanged, so the audit receipt content hash is unaffected
      - an import-linter contract keeps the kernel private: reachable only from contracts, decision and onchain, and importing no domain module itself
    required_tests: [unit, properties, contracts, architecture]
    gates: [ruff_check, ruff_format, pytest, lint_imports, validate_slices]
    stop_for_human: true
    checkpoint_reason: >
      The claim is that a frozen public surface did not move (INV-15, frozen in
      CORE-S005). A human confirms that rather than accepting a self-reported
      test result on the repository's most compatibility-sensitive boundary.
    rationale: >
      A9 is declared because INV-15 maps to A9 in INVARIANTS.md and is enforced
      by the contract surface ratchet, so citing INV-15 while declaring no threat
      would be inconsistent. The ratchet gained callable and signature checks in
      pull request #26, which changes this slice's shape for the better: the
      guard now exists before the refactor rather than being written by the same
      change it constrains, so the acceptance criterion is that an untouched
      ratchet still passes. The private kernel is what keeps the generalisation
      off the public surface — a public generic would change the typing surface
      of a frozen API without changing its behaviour.
