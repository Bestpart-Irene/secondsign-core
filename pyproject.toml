[project]
name = "secondsign-core"
dynamic = ["version"]                       # read from src/secondsign/__init__.py
description = "Runtime authorization for financial AI agents — the gate between an agent and real money"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SecondSign contributors" }]
keywords = [
    "ai-agents",
    "agent-security",
    "authorization",
    "fintech",
    "payments",
    "guardrails",
    "human-in-the-loop",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://secondsignruntime.com"
Repository = "https://github.com/Bestpart-Irene/secondsign-core"
Issues = "https://github.com/Bestpart-Irene/secondsign-core/issues"
Architecture = "https://github.com/Bestpart-Irene/secondsign-core/blob/main/docs/ARCHITECTURE.md"
"Threat model" = "https://github.com/Bestpart-Irene/secondsign-core/blob/main/docs/THREAT_MODEL.md"

[project.optional-dependencies]
# The Stripe rail is opt-in: the deterministic core needs no payment SDK, so
# only a deployment that wires the Stripe executor installs it.
stripe = ["stripe>=15,<16"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "hypothesis==6.162.0",
    "import-linter==2.13",
    "mypy==2.3.0",
    "pyyaml==6.0.3",
    "stripe==15.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/secondsign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secondsign"]

# What a source distribution carries: the package, its tests, the documents that
# make the guarantees checkable, and nothing else. An sdist that ships only code
# asks the reader to take the security properties on trust.
[tool.hatch.build.targets.sdist]
include = [
    "src/secondsign",
    "tests",
    "docs",
    "tools",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["secondsign"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The conformance kit ships in src/ so third parties can import it, but it is
# test code: assertions are its output, not a debugging shortcut.
"src/secondsign/conformance/**" = ["S101"]

[tool.importlinter]
root_package = "secondsign"

# The plugin contract is the boundary every extension speaks through. It must
# stay a leaf: if it ever imports policy, decision, gateway or adapter code,
# plugins gain reach into internals and the contract stops being a contract.
# INV-12. The agent surface is defined by what it cannot reach: an agent that can
# reach limits, the roster, the idempotency store, the ledger or the fingerprint
# key can raise its own limit, approve its own action, replay a spent approval,
# edit its own history, or forge a reference.
#
# `forbidden` is transitive by default, so this covers a breach through an
# intermediate module — which is the realistic one. Nobody adds
# `from secondsign.policy import AmountLimit` to the agent surface; they add a
# helper that happens to import it.
#
# The architecture suite asserts the same property by walking the import graph
# itself. Two mechanisms on purpose: this one fails fast in one line, and that one
# also proves every module is classified and that no unclassified module holds a
# control-plane concern — which a static contract list cannot notice.
[[tool.importlinter.contracts]]
name = "The managed-agent surface must not reach the control plane (INV-12)"
type = "forbidden"
source_modules = ["secondsign.agent"]
forbidden_modules = [
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.controlplane",
    "secondsign.gateway",
    "secondsign.policy",
    "secondsign.rails",
]

# The isolation judgement must not be answerable differently by anything. A module
# that decides which side of the boundary a module is on, and that imports a
# domain module to do it, is a judgement with an input — and an input is something
# an operator can change.
[[tool.importlinter.contracts]]
name = "The isolation judgement depends on nothing (INV-12)"
type = "forbidden"
source_modules = ["secondsign.isolation"]
forbidden_modules = [
    "secondsign.adapters",
    "secondsign.agent",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.contracts",
    "secondsign.controlplane",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.intent",
    "secondsign.policy",
    "secondsign.rails",
]

[[tool.importlinter.contracts]]
name = "Plugin contract must not depend on any other core module"
type = "forbidden"
source_modules = ["secondsign.contracts"]
forbidden_modules = [
    "secondsign.policy",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.adapters",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
