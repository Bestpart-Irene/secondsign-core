[project]
name = "secondsign-core"
version = "0.0.1"
description = "Runtime authorization for financial AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SecondSign contributors" }]
keywords = ["agent-security", "fintech", "payments", "authorization"]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "hypothesis", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["secondsign"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.importlinter]
root_package = "secondsign"

# The plugin contract is the boundary every extension speaks through. It must
# stay a leaf: if it ever imports policy, decision, gateway or adapter code,
# plugins gain reach into internals and the contract stops being a contract.
[[tool.importlinter.contracts]]
name = "Plugin contract must not depend on any other core module"
type = "forbidden"
source_modules = ["secondsign.contracts"]
forbidden_modules = [
    "secondsign.policy",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.adapters",
]
