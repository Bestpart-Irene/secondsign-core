[project]
name = "secondsign-core"
version = "0.0.1"
description = "Runtime authorization for financial AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SecondSign contributors" }]
keywords = ["agent-security", "fintech", "payments", "authorization"]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# The Stripe rail is opt-in: the deterministic core needs no payment SDK, so
# only a deployment that wires the Stripe executor installs it.
stripe = ["stripe>=15,<16"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
    "hypothesis==6.161.0",
    "import-linter==2.13",
    "mypy==2.3.0",
    "pyyaml==6.0.3",
    "stripe==15.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["secondsign"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The conformance kit ships in src/ so third parties can import it, but it is
# test code: assertions are its output, not a debugging shortcut.
"src/secondsign/conformance/**" = ["S101"]

[tool.importlinter]
root_package = "secondsign"

# The plugin contract is the boundary every extension speaks through. It must
# stay a leaf: if it ever imports policy, decision, gateway or adapter code,
# plugins gain reach into internals and the contract stops being a contract.
[[tool.importlinter.contracts]]
name = "Plugin contract must not depend on any other core module"
type = "forbidden"
source_modules = ["secondsign.contracts"]
forbidden_modules = [
    "secondsign.policy",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.adapters",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
