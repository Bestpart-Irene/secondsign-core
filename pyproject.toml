[project]
name = "secondsign-core"
dynamic = ["version"]                       # read from src/secondsign/__init__.py
description = "Runtime authorization for financial AI agents — the gate between an agent and real money"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SecondSign contributors" }]
keywords = [
    "ai-agents",
    "agent-security",
    "authorization",
    "fintech",
    "payments",
    "guardrails",
    "human-in-the-loop",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://secondsignruntime.com"
Repository = "https://github.com/Bestpart-Irene/secondsign-core"
Issues = "https://github.com/Bestpart-Irene/secondsign-core/issues"
Architecture = "https://github.com/Bestpart-Irene/secondsign-core/blob/main/docs/ARCHITECTURE.md"
"Threat model" = "https://github.com/Bestpart-Irene/secondsign-core/blob/main/docs/THREAT_MODEL.md"

[project.optional-dependencies]
# The Stripe rail is opt-in: the deterministic core needs no payment SDK, so
# only a deployment that wires the Stripe executor installs it.
stripe = ["stripe>=15,<16"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "hypothesis==6.163.0",
    "import-linter==2.13",
    "mypy==2.3.0",
    "pyyaml==6.0.3",
    "stripe==15.3.1",
    # Generates the reference deployment's ephemeral PKI. Development only — it
    # is not a runtime dependency and must never become one; `[project]` keeps
    # exactly one, and the licence gate inspects the built wheel rather than the
    # CI environment precisely so this distinction stays real.
    "cryptography==49.0.0",
    # `tests/packaging/test_sdist.py` builds a real source distribution rather
    # than reading the include list, because the list is not the artefact. Both
    # are dev dependencies so the build runs with `--no-isolation`: a test that
    # reaches the network to fetch its own backend fails for reasons that have
    # nothing to do with what it asserts.
    "build==1.5.0",
    "hatchling==1.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/secondsign/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secondsign"]

# What a source distribution carries: the package, its tests, the documents that
# make the guarantees checkable, and nothing else. An sdist that ships only code
# asks the reader to take the security properties on trust.
[tool.hatch.build.targets.sdist]
include = [
    "src/secondsign",
    "tests",
    # Listed explicitly because the entries here are gitignore-style patterns:
    # the bare "README.md" below is depth-agnostic and already matched the
    # example's README, so omitting this line shipped a document describing two
    # files that were not in the artefact. `tests/packaging/test_sdist.py`
    # asserts the modules ship, because a `testpaths` entry that matches nothing
    # is skipped in silence — the certification would simply not exist inside
    # the published source distribution, and nothing would say so.
    "examples",
    # The same failure one directory over, and louder: `tests/deployment` loads
    # `deploy/reference/tls/generate.py` by path at import time, and
    # `tests/client` loads it through that module. A missing script there does
    # not skip a test — it raises during collection and interrupts the whole
    # suite inside the artefact. `client` ships for the second half of the same
    # reason: the client suite builds that distribution's wheel from source, so
    # an sdist without it carries tests that cannot run. Neither directory is
    # part of what `secondsign-core` installs; both are part of what its source
    # distribution has to contain to be checkable.
    "deploy",
    "client",
    "docs",
    "tools",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    # Shipped because the suite asserts against it: the contributor list is a
    # copyright record, and a test that reads it has to find it here too.
    "CONTRIBUTORS.md",
    "GOVERNANCE.md",
    "pyproject.toml",
    # Same reason as CONTRIBUTORS.md, one layer further in: `test_ci_gates.py`
    # reads `ci.yml` to assert that every job id `tools/ci_gates.py` reasons
    # about still exists. Without the workflow here that test does not fail —
    # it raises during collection, which interrupts the whole suite inside the
    # artefact rather than reporting one missing file.
    ".github/workflows",
]

[tool.pytest.ini_options]
# `examples/` is on the path so a worked example's conformance subclass is run by
# the normal test suite — an example that ships a certification nobody executes
# would rot the moment the surface it certifies against moved.
testpaths = ["tests", "examples"]
# `deployment` is deselected by default because it needs Docker and a built
# reference stack, which no contributor should have to install to run the unit
# suite. It is not optional, though — it is its own CI gate (`deployment_topology`),
# and there it runs with `-m deployment` and fails rather than skips when Docker
# is missing. Deselected-by-default and skipped-when-unavailable are different
# things: the first is a choice about which gate you are running, the second is a
# gate reporting green having verified nothing.
addopts = "-q -m 'not deployment and not deployment_mutation'"
markers = [
    "deployment: runs against the containerised reference deployment (CORE-S019)",
    # Its own marker rather than a second `deployment` case, because it stands up
    # a second stack and because it is not a gate: it is the evidence that the
    # deployment gate is one. `-m deployment` must not pick it up, and neither
    # must the default run.
    "deployment_mutation: requires the deployment gate to fail against a joined topology (CORE-S019)",
]

[tool.coverage.run]
source = ["secondsign"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated, not inherited. `extend-select` extends whatever the linter's default
# set happens to be, so a version bump can add or drop rules and change what
# this gate means without a line of this file changing — which is how a pinned
# toolchain stops being deterministic. `select` names the rules the project has
# decided on; adopting a new one is then its own change, argued on its merits.
#
# E4/E7/E9 + F is pycodestyle-and-pyflakes minus the formatter's territory; I is
# import order, B is bugbear, S is bandit.
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The conformance kit ships in src/ so third parties can import it, but it is
# test code: assertions are its output, not a debugging shortcut.
"src/secondsign/conformance/**" = ["S101"]
# Worked examples carry their own tests, and a test's assertions are its output.
"examples/**" = ["S101"]

[tool.importlinter]
root_package = "secondsign"

# The plugin contract is the boundary every extension speaks through. It must
# stay a leaf: if it ever imports policy, decision, gateway or adapter code,
# plugins gain reach into internals and the contract stops being a contract.
# INV-12. The agent surface is defined by what it cannot reach: an agent that can
# reach limits, the roster, the idempotency store, the ledger or the fingerprint
# key can raise its own limit, approve its own action, replay a spent approval,
# edit its own history, or forge a reference.
#
# `forbidden` is transitive by default, so this covers a breach through an
# intermediate module — which is the realistic one. Nobody adds
# `from secondsign.policy import AmountLimit` to the agent surface; they add a
# helper that happens to import it.
#
# The architecture suite asserts the same property by walking the import graph
# itself. Two mechanisms on purpose: this one fails fast in one line, and that one
# also proves every module is classified and that no unclassified module holds a
# control-plane concern — which a static contract list cannot notice.
[[tool.importlinter.contracts]]
name = "The managed-agent surface must not reach the control plane (INV-12)"
type = "forbidden"
source_modules = ["secondsign.agent"]
forbidden_modules = [
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.conformance",
    "secondsign.controlplane",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.policy",
    "secondsign.rails",
]

# The third side of the classification, enforced since CORE-S024 (issue #58).
# `shared` means safe for both sides, and for two of the three sides that was a
# gate while for this one it was a docstring. The realistic breach is quiet: a
# shared module that pulls in the control plane stays green until somebody
# imports it agent-side, and the violation then surfaces in a pull request
# that did not create it. Sources are the shared prefixes; the architecture
# suite derives the same list from `secondsign.isolation` so a new shared
# prefix is covered there the moment it exists, and this contract is the
# fail-fast one-line half of the pair.
[[tool.importlinter.contracts]]
name = "Shared modules must not reach the control plane (INV-12)"
type = "forbidden"
source_modules = [
    "secondsign.adapters",
    "secondsign.contracts",
    "secondsign.intent",
    "secondsign.isolation",
    "secondsign.onchain",
]
forbidden_modules = [
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.conformance",
    "secondsign.controlplane",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.policy",
    "secondsign.rails",
]

# The isolation judgement must not be answerable differently by anything. A module
# that decides which side of the boundary a module is on, and that imports a
# domain module to do it, is a judgement with an input — and an input is something
# an operator can change.
[[tool.importlinter.contracts]]
name = "The isolation judgement depends on nothing (INV-12)"
type = "forbidden"
source_modules = ["secondsign.isolation"]
forbidden_modules = [
    "secondsign.adapters",
    "secondsign.agent",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.contracts",
    "secondsign.controlplane",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.intent",
    "secondsign.policy",
    "secondsign.rails",
]

[[tool.importlinter.contracts]]
name = "Plugin contract must not depend on any other core module"
type = "forbidden"
source_modules = ["secondsign.contracts"]
forbidden_modules = [
    "secondsign.policy",
    "secondsign.decision",
    "secondsign.gateway",
    "secondsign.approval",
    "secondsign.audit",
    "secondsign.adapters",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
